<script>
    document.addEventListener('DOMContentLoaded', () => {
        const roleButtons = document.querySelectorAll('#role-tabs-container button');
        const slidingPill = document.getElementById('sliding-pill');
        const loginForm = document.getElementById('login-form');
        
        let currentRole = 'user';

        roleButtons.forEach((button, index) => {
            button.addEventListener('click', (e) => {
                const targetRole = e.currentTarget.getAttribute('data-role');
                if (targetRole === currentRole) return;
                
                // 1. Calculate how far right the pill needs to slide physically (0%, 33.33%, or 66.66%)
                const translateValue = index * 100;
                slidingPill.style.transform = `translateX(${translateValue}%)`;
                
                // 2. Adjust text colors dynamically so the text over the pill turns dark/readable
                roleButtons.forEach(btn => {
                    btn.classList.remove('text-on-primary-container', 'font-semibold');
                    btn.classList.add('text-on-surface-variant');
                });
                
                e.currentTarget.classList.remove('text-on-surface-variant');
                e.currentTarget.classList.add('text-on-primary-container', 'font-semibold');
                
                currentRole = targetRole;
            });
        });

        // Form Submit Handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const emailVal = document.getElementById('email').value;
            alert(`Logging in as role: ${currentRole.toUpperCase()}\nEmail: ${emailVal}`);
        });
    });
</script>
